name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Every combination of operating system and Node version runs as its own job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}, Node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci installs exactly what package-lock.json says, so CI tests the same versions.
      - run: npm ci
      - run: npm run build
      - run: npm test
